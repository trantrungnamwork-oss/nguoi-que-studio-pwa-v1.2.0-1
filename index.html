<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f4b7c">
<meta name="description" content="Làm video hoạt hình người que 9:16, 1:1, 16:9 ngay trên điện thoại, miễn phí.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Người Que Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Be+Vietnam+Pro:wght@400;500;600;700&family=Oswald:wght@700&display=swap">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
img { max-width: 100%; }
:root {
  --ground: #eceff2;
  --surface: #ffffff;
  --surface-2: #f5f6f8;
  --ink: #15171c;
  --ink-2: #5a616e;
  --ink-3: #8a909b;
  --line: #d8dce2;
  --accent: #2f4b7c;
  --accent-ink: #ffffff;
  --accent-soft: #e3e9f3;
  --marker: #ffd23f;
  --marker-ink: #15171c;
  --rec: #e5484d;
  --ok: #2e9e62;
  --warn: #b7791f;
  --stage: #1b1d22;
  --shadow: 0 1px 2px rgba(20, 24, 32, .06), 0 6px 18px rgba(20, 24, 32, .06);
  --r: 12px;
  --display: "Baloo 2", "Be Vietnam Pro", system-ui, sans-serif;
  --body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #101216; --surface: #191c22; --surface-2: #21252c; --ink: #eceef2; --ink-2: #a5acb8; --ink-3: #737a86;
    --line: #2d323a; --accent: #92b1e6; --accent-ink: #0e1422; --accent-soft: #1f2a3d; --stage: #0b0c0f;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #101216; --surface: #191c22; --surface-2: #21252c; --ink: #eceef2; --ink-2: #a5acb8; --ink-3: #737a86;
  --line: #2d323a; --accent: #92b1e6; --accent-ink: #0e1422; --accent-soft: #1f2a3d; --stage: #0b0c0f;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25); color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--ground); }
body { margin: 0; color: var(--ink); font: 400 15px/1.5 var(--body); -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { max-width: 1280px; margin: 0 auto; padding-inline: 16px; padding-block: 0 48px; }

/* thanh trên */
.topbar { display: flex; align-items: center; gap: 12px; padding-block: 12px; }
.topbar .btn.marker { flex: none; }
.hist { display: flex; gap: 0; flex: none; }
.hist .btn { min-width: 40px; min-height: 40px; }
@media (max-width: 430px) { .topbar { gap: 6px; } .topbar .btn.marker { padding-inline: 10px; font-size: 15px; } .brand-mark { display: none; } .hist .btn { min-width: 36px; } }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.brand-mark { width: 34px; height: 34px; flex: none; }
.brand h1 { font: 800 clamp(18px, 5.2vw, 22px)/1 var(--display); letter-spacing: -.01em; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand small { display: block; font: 500 12px/1.2 var(--body); color: var(--ink-2); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-text { min-width: 0; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 12px; font-weight: 600; font-size: 14px; line-height: 1.2; min-height: 40px; }
.btn:hover { border-color: var(--ink-3); }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.marker { background: var(--marker); color: var(--marker-ink); border-color: transparent; font-family: var(--display); font-weight: 800; font-size: 16px; }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.danger { color: var(--rec); }
.btn.small { min-height: 32px; padding: 5px 9px; font-size: 13px; border-radius: 8px; }
.btn.icon { padding: 6px; min-width: 36px; min-height: 36px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.rec-on { background: var(--rec); color: #fff; border-color: transparent; }

/* bố cục */
.layout { display: grid; gap: 16px; grid-template-columns: 1fr; }
@media (min-width: 900px) {
  .layout { grid-template-columns: minmax(300px, 400px) 1fr; align-items: start; }
  .stage { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
}

.stage { min-width: 0; background: var(--stage); border-radius: 18px; padding: 12px; color: #eef0f3; box-shadow: var(--shadow); }
.stage-row { display: flex; gap: 12px; align-items: stretch; }
.canvas-wrap { position: relative; flex: none; height: min(46vh, 420px); aspect-ratio: 9 / 16; max-width: 100%; border-radius: 10px; overflow: hidden; background: #000; }
@media (min-width: 900px) { .canvas-wrap { height: auto; width: 100%; } .stage-row { flex-direction: column; } }
#cv { width: 100%; height: 100%; display: block; touch-action: pan-y; cursor: grab; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.canvas-wrap.editing #cv { touch-action: none; }
.stage[data-format="1:1"] .canvas-wrap { aspect-ratio: 1 / 1; height: min(40vh, 360px); }
.stage[data-format="16:9"] .canvas-wrap { aspect-ratio: 16 / 9; height: auto; width: 100%; }
.stage[data-format="16:9"] .stage-row { flex-direction: column; }
@media (max-width: 520px) { .stage[data-format="1:1"] .stage-row { flex-direction: column; } .stage[data-format="1:1"] .canvas-wrap { width: 100%; height: auto; } }
.edit-bar { position: absolute; left: 4px; top: 4px; right: 4px; display: flex; flex-wrap: wrap; gap: 2px; z-index: 2; pointer-events: none; }
.edit-bar[hidden] { display: none; }
.edit-bar button { pointer-events: auto; border: 0; border-radius: 8px; background: rgba(21,23,28,.82); color: #ffd23f; font: 700 11px/1 var(--body); padding: 5px 4px; min-height: 28px; min-width: 25px; }
.edit-bar button.x { margin-left: auto; }
.tl { margin-top: 10px; min-width: 0; max-width: 100%; }
.tl-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 11.5px; color: #9aa1ac; margin-bottom: 4px; }
.tl-zoom { display: flex; gap: 4px; flex: none; }
.tl-zoom button { width: 30px; height: 26px; border-radius: 7px; border: 1px solid #3a3e47; background: #2a2d34; color: #fff; font-weight: 700; }
.tl-scroll { overflow-x: auto; overflow-y: hidden; border-radius: 8px; background: #25282f; touch-action: pan-x; scrollbar-width: thin; }
.tl-track { position: relative; height: 62px; min-width: 100%; }
.tl-scenes, .tl-beats { position: absolute; left: 0; right: 0; }
.tl-scenes { top: 4px; height: 18px; }
.tl-beats { top: 25px; height: 32px; }
.tl-scene { position: absolute; top: 0; height: 18px; border: 0; border-radius: 5px; color: #fff; font: 700 10.5px/18px var(--body); padding: 0 6px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: .85; }
.tl-scene.sel { opacity: 1; box-shadow: 0 0 0 2px #fff inset; }
.tl-beat { position: absolute; top: 0; height: 32px; background: #3a3f48; border: 1px solid #4b515c; border-top: 3px solid #5b8def; border-radius: 6px; color: #e6e8ec; font: 600 10.5px/1 var(--body); overflow: visible; cursor: pointer; }
.tl-beat span { display: block; padding: 7px 5px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tl-beat.cur { background: #4a5260; border-color: #ffd23f; }
.tl-beat.fixed span::after { content: " ⏱"; }
.tl-handle { position: absolute; right: -7px; top: -3px; width: 14px; height: 36px; cursor: ew-resize; touch-action: none; z-index: 1; }
.tl-handle::after { content: ""; position: absolute; left: 5px; top: 8px; width: 4px; height: 18px; border-radius: 2px; background: #ffd23f; }
.tl-beat.dragging { border-color: #ffd23f; }
.tl-beat.dragging::after { content: attr(data-len); position: absolute; right: 0; top: -22px; background: #ffd23f; color: #15171c; font: 800 11px/1 var(--body); padding: 4px 6px; border-radius: 6px; white-space: nowrap; }
.tl-head { position: absolute; top: 0; bottom: 0; width: 2px; background: #ff5a4e; pointer-events: none; }
.drag-hint { margin: 0; font-size: 12px; color: #9aa1ac; }
.play-overlay { position: absolute; right: 8px; bottom: 8px; display: grid; place-items: center; background: transparent; border: 0; padding: 0; }
.play-overlay span { width: 44px; height: 44px; border-radius: 50%; background: rgba(0, 0, 0, .55); display: grid; place-items: center; backdrop-filter: blur(2px); }
.play-overlay svg { width: 20px; height: 20px; fill: #fff; margin-left: 2px; }
.stage-side { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; justify-content: space-between; }
.now { font-size: 13px; color: #b9bec8; min-height: 3.2em; }
.now b { display: block; color: #fff; font: 800 17px/1.25 var(--display); margin-bottom: 2px; overflow-wrap: anywhere; }
.transport { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.transport .btn { background: #2a2d34; border-color: #3a3e47; color: #fff; }
.transport .btn.primary { background: var(--marker); color: var(--marker-ink); }
.time { font: 600 13px/1 var(--body); font-variant-numeric: tabular-nums; color: #c9ced6; }
.scrub { position: relative; margin-top: 12px; }
.scrub input { width: 100%; margin: 0; accent-color: var(--marker); height: 28px; }
.ticks { position: absolute; left: 8px; right: 8px; top: 0; height: 6px; pointer-events: none; }
.ticks i { position: absolute; top: 0; width: 2px; height: 6px; background: #6b717c; border-radius: 1px; }

/* tabs */
.panel { min-width: 0; }
.tabs { display: flex; gap: 4px; overflow-x: auto; padding: 4px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; scrollbar-width: none; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; border: 0; background: transparent; padding: 8px 12px; border-radius: 9px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.tab[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.pane { padding-top: 14px; display: grid; gap: 14px; }
.pane[hidden] { display: none !important; }

.section-title { font: 800 18px/1.2 var(--display); margin: 6px 0 0; text-wrap: balance; }
.hint { color: var(--ink-2); font-size: 13px; margin: 0; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row.between { justify-content: space-between; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 420px) { .grid3 { grid-template-columns: 1fr 1fr; } }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 10px; }
.card.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.field { display: grid; gap: 4px; min-width: 0; }
.field > span { font-size: 12px; font-weight: 600; color: var(--ink-2); letter-spacing: .02em; }
input[type="text"], input[type="number"], select, textarea { width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--surface-2); border-radius: 9px; padding: 8px 10px; min-height: 38px; }
textarea { resize: vertical; line-height: 1.45; }
textarea.say { font-size: 16px; min-height: 58px; background: var(--surface); }
textarea.code { font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; min-height: 280px; white-space: pre; overflow: auto; }
input[type="range"] { width: 100%; accent-color: var(--accent); }
input[type="color"] { width: 100%; height: 38px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface-2); padding: 3px; }
.check { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }

.beat-head { display: flex; gap: 8px; align-items: center; }
.beat-no { flex: none; width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font: 800 15px/1 var(--display); }
.beat-head select { flex: 1; }
.dur { flex: none; font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.beat-tools { display: flex; gap: 2px; flex-wrap: wrap; }
details.more > summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--accent); list-style: none; }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::before { content: "+ "; }
details.more[open] > summary::before { content: "– "; }
details.more[open] > .more-body { margin-top: 10px; display: grid; gap: 10px; }
.charrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; align-items: center; padding-top: 8px; border-top: 1px dashed var(--line); }
.charrow b { grid-column: 1 / -1; font-size: 13px; }
@media (max-width: 480px) { .charrow { grid-template-columns: 1fr 1fr; } }
.charrow select { font-size: 13px; min-height: 34px; padding: 5px 8px; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2); }
.pill.ok { color: var(--ok); }

.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 6px 10px; border-radius: 8px; font-weight: 600; font-size: 13px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

.bgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(82px, 1fr)); gap: 8px; }
.bgopt { border: 2px solid transparent; border-radius: 10px; padding: 0; background: var(--surface-2); overflow: hidden; display: grid; text-align: left; position: relative; }
.bgopt canvas, .bgopt img { width: 100%; height: auto; display: block; }
.bgopt span { font-size: 11.5px; font-weight: 600; padding: 4px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bgopt[aria-pressed="true"] { border-color: var(--accent); }
.bgs > div > .x { position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; border-radius: 50%; border: 0; background: rgba(0, 0, 0, .6); color: #fff; font-size: 14px; line-height: 1; }

.charhead { display: grid; grid-template-columns: 96px 1fr; gap: 12px; align-items: start; }
.charhead > canvas { width: 96px; height: 128px; background: var(--surface-2); border-radius: 10px; }
.charhead .body { display: grid; gap: 8px; min-width: 0; }
.row.nowrap { flex-wrap: nowrap; align-items: end; }

.tpl { display: grid; gap: 6px; }
.tpl .kind { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.tpl h3 { margin: 0; font: 800 17px/1.2 var(--display); }
.tpl .kind.mine, .libcard .tag.mine { color: var(--ok); }
.lib { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
.libcard { padding: 8px; gap: 4px; justify-items: center; text-align: center; }
.libcard canvas { width: 84px; height: 112px; background: var(--surface-2); border-radius: 10px; }
.libcard .name { font-weight: 700; font-size: 13px; line-height: 1.25; }
.libcard .tag { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.faces { display: grid; grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); gap: 6px; }
.faceopt { border: 1px dashed var(--line); border-radius: 10px; background: var(--surface-2); padding: 4px; display: grid; gap: 2px; font-size: 10.5px; font-weight: 600; color: var(--ink-2); text-align: center; line-height: 1.2; }
.faceopt canvas { width: 100%; aspect-ratio: 1; display: block; border-radius: 6px; }
.faceopt.on { border-style: solid; border-color: var(--accent); background: var(--surface); }
pre.tech { margin: 0; white-space: pre-wrap; word-break: break-word; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; padding: 10px; }
.tpls { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }

.progress { height: 10px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 99px; overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s linear; }
video.result { width: 100%; max-width: 280px; aspect-ratio: 9 / 16; background: #000; border-radius: 12px; }
.warnings { margin: 0; padding-left: 18px; color: var(--warn); font-size: 13px; }
.kbd { font: 600 12px/1 var(--body); padding: 2px 6px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 6px; background: var(--surface); }

.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); transform: translateX(-50%); background: var(--ink); color: var(--ground); padding: 10px 14px; border-radius: 12px; font-weight: 600; font-size: 14px; box-shadow: var(--shadow); z-index: 50; display: flex; gap: 10px; align-items: center; max-width: calc(100% - 32px); }
.toast button { background: transparent; border: 0; color: var(--marker); font-weight: 700; }

.mini { position: fixed; right: 12px; top: calc(env(safe-area-inset-top, 0px) + 58px); width: 84px; aspect-ratio: 9 / 16; border-radius: 10px; overflow: hidden; box-shadow: 0 6px 20px rgba(0, 0, 0, .3); z-index: 20; border: 2px solid var(--surface); background: #000; padding: 0; }
.mini canvas { width: 100%; height: 100%; display: block; }
.mini[data-format="1:1"] { aspect-ratio: 1 / 1; width: 110px; }
.mini[data-format="16:9"] { aspect-ratio: 16 / 9; width: 150px; }
@media (min-width: 900px) { .mini { display: none !important; } }

.foot { margin-top: 24px; color: var(--ink-3); font-size: 12px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
.poserow { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; align-items: end; padding: 4px 0 2px; }
.poserow .row { grid-column: 1 / -1; }
.poserow .field > span { font-variant-numeric: tabular-nums; }
.scenes { display: grid; gap: 8px; }
.scene-card { grid-template-columns: auto 1fr; align-items: start; border-left: 5px solid var(--sc, var(--accent)); cursor: pointer; }
.scene-card .sc-thumb { width: 64px; height: auto; border-radius: 8px; background: var(--surface-2); display: block; }
.scene-card .body { display: grid; gap: 6px; min-width: 0; }
.scene-card select { font-size: 13px; min-height: 34px; padding: 5px 8px; flex: 1; min-width: 150px; }
details.bggroup > summary { cursor: pointer; font-weight: 700; font-size: 14px; padding: 6px 0; list-style: none; }
details.bggroup > summary::before { content: "▸ "; color: var(--accent); }
details.bggroup[open] > summary::before { content: "▾ "; }
details.bggroup > .bgs { margin: 4px 0 8px; }

</style>
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="13" r="10.5" fill="#fff" stroke="#15171c" stroke-width="2.2"/><ellipse cx="14" cy="12" rx="2.6" ry="3.1" fill="#fff" stroke="#15171c" stroke-width="1.4"/><ellipse cx="20.6" cy="12" rx="2.6" ry="3.1" fill="#fff" stroke="#15171c" stroke-width="1.4"/><circle cx="14.8" cy="12.4" r="1.3" fill="#15171c"/><circle cx="21.4" cy="12.4" r="1.3" fill="#15171c"/><path d="M14.5 17.2q2.6 2.2 5.4 0" fill="none" stroke="#15171c" stroke-width="1.6" stroke-linecap="round"/><path d="M17 23.5v8M11 33l6-5 6 5" fill="none" stroke="#15171c" stroke-width="2.2" stroke-linecap="round"/><rect x="11.5" y="23" width="11" height="6" rx="2" fill="#ffd23f" stroke="#15171c" stroke-width="1.6"/></svg>
      <div class="brand-text">
        <h1>Người Que Studio</h1>
        <small id="projName">Video hoạt hình người que</small>
      </div>
    </div>

  /* xử lý ảnh mặt: xoá nền trắng nối với mép ảnh (giữ phần trắng bên trong viền), cắt sát, đưa về ô vuông 256 px */
  N.clearWhiteBg = function (d, W, H) {
    var seen = new Uint8Array(W * H), q = new Int32Array(W * H), qh = 0, qt = 0;
    function bg(p) { var o = p * 4, r = d[o], g = d[o + 1], b = d[o + 2]; if (d[o + 3] < 24) return true; var mn = Math.min(r, g, b), mx = Math.max(r, g, b); return mn > 222 && mx - mn < 30; }
    function push(p) { if (!seen[p]) { seen[p] = 1; if (bg(p)) q[qt++] = p; } }
    var x, y;
    for (x = 0; x < W; x++) { push(x); push((H - 1) * W + x); }
    for (y = 0; y < H; y++) { push(y * W); push(y * W + W - 1); }
    while (qh < qt) {
      var p = q[qh++]; d[p * 4 + 3] = 0; x = p % W; y = (p / W) | 0;
      if (x > 0) push(p - 1); if (x < W - 1) push(p + 1); if (y > 0) push(p - W); if (y < H - 1) push(p + W);
    }
    // làm mềm mép: điểm sáng sát vùng đã xoá thì trong suốt một phần
    for (var i = 0; i < W * H; i++) {
      if (d[i * 4 + 3] === 0) continue; x = i % W; y = (i / W) | 0;
      var nb = (x > 0 && d[(i - 1) * 4 + 3] === 0) || (x < W - 1 && d[(i + 1) * 4 + 3] === 0) || (y > 0 && d[(i - W) * 4 + 3] === 0) || (y < H - 1 && d[(i + W) * 4 + 3] === 0);
      if (!nb) continue;
      var mn2 = Math.min(d[i * 4], d[i * 4 + 1], d[i * 4 + 2]);
      if (mn2 > 170) d[i * 4 + 3] = Math.round(d[i * 4 + 3] * clamp((255 - mn2) / 85, 0, 1));
    }
  };
  N.alphaBox = function (d, W, H) {
    var x0 = W, y0 = H, x1 = -1, y1 = -1, n = 0;
    for (var y = 0; y < H; y++) for (var x = 0; x < W; x++) if (d[(y * W + x) * 4 + 3] > 40) { n++; if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }

  };
  function cutFace(img, sx, sy, sw, sh, white) {
    var W = Math.max(8, Math.round(Math.min(sw, 640))), H = Math.max(8, Math.round(sh * W / sw));
    var c = h('canvas', { width: W, height: H }), x = c.getContext('2d', { willReadFrequently: true });
    x.drawImage(img, sx, sy, sw, sh, 0, 0, W, H);
    var id = x.getImageData(0, 0, W, H);
    if (white) N.clearWhiteBg(id.data, W, H);
    var bb = N.alphaBox(id.data, W, H); if (!bb) return Promise.resolve(null);
    x.putImageData(id, 0, 0);
    var bw = bb[2] - bb[0] + 1, bh = bb[3] - bb[1] + 1, side = Math.max(bw, bh) * 1.04, OUT = 256, s = OUT / side;
    var o = h('canvas', { width: OUT, height: OUT }), oc = o.getContext('2d');
    oc.imageSmoothingQuality = 'high';
    oc.drawImage(c, bb[0], bb[1], bw, bh, (OUT - bw * s) / 2, (OUT - bh * s) / 2, bw * s, bh * s);
    return new Promise(function (res) { o.toBlob(function (b) { res(b); }, 'image/png'); });
  }
  /** Nhập bảng biểu cảm (lưới hàng × cột, đọc trái→phải, trên→dưới theo N.FACE_ORDER) cho nhân vật thứ ci */
  function importFaceSheet(ci, blob, rows, cols, white) {
    rows = clamp(Math.round(rows) || 4, 1, 8); cols = clamp(Math.round(cols) || 4, 1, 8);
    var cname = S.P.chars[ci].name, cid = S.P.chars[ci].id;
    return loadImage(blob).then(function (img) {
      var cw = img.width / cols, ch = img.height / rows, inset = 0.03, jobs = [];
      N.FACE_ORDER.forEach(function (k, idx) {
        if (idx >= rows * cols) return;
        var r = Math.floor(idx / cols), c = idx % cols;
        jobs.push(cutFace(img, c * cw + cw * inset, r * ch + ch * inset, cw * (1 - 2 * inset), ch * (1 - 2 * inset), white).then(function (b) {
          return b ? addAsset(b, 'face', cname + ' · ' + faceLabel(k)).then(function (id) { return [k, id]; }) : null;
        }));
      });
      return Promise.all(jobs);
    }).then(function (pairs) {
      var got = pairs.filter(Boolean);

  /* thư viện nhân vật: mẫu có sẵn (ẩn được) + nhân vật của tôi (localStorage) */
  function libUser() { return store.get('nqs.lib') || []; }
  function libHidden() { return store.get('nqs.libHidden') || []; }
  function libAll() {
    var hid = libHidden();
    return libUser().map(function (c) { return { key: c.key, mine: true, c: c }; })
      .concat(N.CHAR_PRESETS.filter(function (p) { return hid.indexOf(p.key) < 0; }).map(function (p) { return { key: p.key, mine: false, c: p }; }));
  }
  function saveToLib(c) {
    var list = libUser(), e = clone(c);
    ['id', 'x', 'face', 'depth', 'kid'].forEach(function (k) { delete e[k]; });
    e.key = uid('u'); e.saved = Date.now();
    var j = list.findIndex(function (x) { return x.name === e.name; });
    if (j >= 0) { e.key = list[j].key; list[j] = e; } else list.unshift(e);
    if (!store.set('nqs.lib', list)) { toast('Bộ nhớ trình duyệt đầy — xoá bớt nhân vật trong thư viện'); return null; }
    toast(j >= 0 ? 'Đã cập nhật "' + e.name + '" trong thư viện' : 'Đã lưu "' + e.name + '" vào thư viện');
    return e.key;
  }

    if (j >= 0) {
      var rm = list.splice(j, 1)[0]; store.set('nqs.lib', list);
      toast('Đã xoá "' + rm.name + '" khỏi thư viện', { label: 'Hoàn tác', fn: function () { var l = libUser(); l.splice(j, 0, rm); store.set('nqs.lib', l); if (S.tab === 'chars') renderChars(true); } });
    } else {
      var hid = libHidden(); if (hid.indexOf(key) < 0) hid.push(key); store.set('nqs.libHidden', hid);
      toast('Đã ẩn mẫu có sẵn', { label: 'Hoàn tác', fn: function () { store.set('nqs.libHidden', libHidden().filter(function (k) { return k !== key; })); if (S.tab === 'chars') renderChars(true); } });
    }
    if (S.tab === 'chars') renderChars(true);
  }
  function addFromLib(c) {
    if (S.P.chars.length >= 6) { toast('Mỗi video tối đa 6 nhân vật'); return false; }
    mutate(function (P) {
      var o = clone(c); delete o.key; delete o.saved;
      o.id = uid('nv');
      var xs = P.chars.map(function (ch) { return ch.x; }), best = 0.5, bd = -1;
      for (var x = 0.2; x <= 0.801; x += 0.05) {

  }

    bar.style.width = pct.toFixed(1) + '%'; tx.textContent = msg;
  }
  document.addEventListener('visibilitychange', function () {
    if (document.hidden && S.exporting && S.exMode === 'realtime') { S.cancelExport = true; S.cancelReason = 'Đã dừng ghi vì bạn rời ứng dụng. Giữ màn hình mở rồi xuất lại (hoặc dùng Xuất chuẩn).'; }
    if (document.hidden && S.playing) stop();
    if (S.exporting) updExProgress();
  });
  function saveAudio() {
    if (typeof OfflineAudioContext === 'undefined') { toast('Trình duyệt chưa hỗ trợ trộn âm thanh'); return Promise.resolve(); }
    toast('Đang trộn âm thanh…');
    return N.renderAudio(S.P, S.TL, S.A).then(function (buf) { return saveMaybeZip(N.audioToWav(buf), baseName() + '.wav'); })
      .catch(function (e) { toast('Không trộn được âm thanh: ' + ((e && e.message) || e)); });
  }
  function saveSrt() {
    var txt = N.makeSrt(S.TL);
    if (!txt.trim()) { toast('Chưa có câu thoại nào'); return Promise.resolve(); }
    return saveMaybeZip(new Blob(['﻿' + txt], { type: 'application/x-subrip' }), baseName() + '.srt');
  }
  function techInfo() {
    var L = S.lastExport, lines = ['Người Que Studio ' + N.VERSION, 'Trình duyệt: ' + navigator.userAgent];
    Object.keys(S.probeRes || {}).forEach(function (r) { var p = S.probeRes[r]; if (p) lines.push('Xuất chuẩn ' + r + ': ' + (p.ok ? 'có · ' + p.label : (p.videoOnly ? 'chỉ hình · ' + p.label : 'không') + (p.reason ? ' (' + p.reason + ')' : ''))); });
    lines.push('Ghi thẳng ra bộ nhớ máy (OPFS): ' + (navigator.storage && navigator.storage.getDirectory ? 'có thể' : 'không') + ' · Chọn nơi lưu: ' + (window.showSaveFilePicker ? 'có' : 'không'));
    lines.push('Ghi thời gian thực: ' + (pickMime() || 'không'));
    if (L) {
      var mbps = L.blob.size * 8 / 1e6 / Math.max(0.1, L.dur);
      lines.push('Lần xuất gần nhất: ' + L.info, 'Dung lượng ' + (L.blob.size / 1048576).toFixed(2) + ' MB · ' + mbps.toFixed(1) + ' Mbps · ' + L.dur.toFixed(2) + ' s video · xuất mất ' + L.secs.toFixed(1) + ' s · lưu tạm: ' + (L.storage === 'opfs' ? 'bộ nhớ máy (OPFS)' : 'RAM') + (L.savedTo ? ' · đã ghi vào ' + L.savedTo : ''));
    }
    if (S.lastError) lines.push('Lỗi gần nhất: ' + S.lastError);
    return lines.join('\n');
  }
  function renderExport() {
    var pane = $('#pane-export'); if (S.tab !== 'export') return; pane.textContent = '';
    pane.appendChild(h('h2', { class: 'section-title' }, 'Xuất video'));
    var s7 = exportSize(720), s10 = exportSize(1080), fm = N.FORMATS[S.P.format] || N.FORMATS['9:16'];
    pane.appendChild(h('p', { class: 'hint' }, 'Khung ' + fm.vi + ' (' + fm.note + ') — đổi ở tab Cảnh & Âm thanh.'));
    pane.appendChild(h('div', { class: 'row' }, h('span', { class: 'hint' }, 'Chất lượng'),
      seg([[720, '720p · ' + s7.W + '×' + s7.H], [1080, '1080p · ' + s10.W + '×' + s10.H]], S.exportRes, function (v) { S.exportRes = v; store.set('nqs.res', v); renderExport(); })));
    pane.appendChild(h('div', { class: 'row' }, h('span', { class: 'hint' }, 'Cách xuất'),
      seg([['auto', 'Tự động'], ['webcodecs', 'Xuất chuẩn'], ['realtime', 'Ghi thời gian thực']], S.exportEngine, function (v) { S.exportEngine = v; store.set('nqs.engine', v); renderExport(); })));
    var status = h('p', { class: 'hint', id: 'exProbe' }, 'Đang kiểm tra bộ mã hoá của máy…');
    pane.appendChild(status);
    if (window.showSaveFilePicker) {
      var pd = h('input', { type: 'checkbox', checked: !!S.pickDest }); pd.addEventListener('change', function () { S.pickDest = pd.checked; store.set('nqs.pickDest', pd.checked); });
      pane.appendChild(h('label', { class: 'check' }, pd, 'Chọn nơi lưu trước khi xuất (ghi thẳng vào file bạn chọn)'));
    }
    var sz0 = exportSize(S.exportRes);
    probeFor(S.exportRes).then(function (cap) {
      S.probeRes = S.probeRes || {}; S.probeRes[sz0.W + 'x' + sz0.H] = cap;
      var mime = pickMime(), eng = S.exportEngine;
      var msg;
      if (eng === 'realtime') msg = 'Ghi thời gian thực: ' + (mime ? mime.split(';')[0] : 'trình duyệt chưa hỗ trợ') + ' · mất đúng bằng độ dài video · máy yếu có thể rơi khung ở 1080p.';
      else if (cap.ok) msg = '✓ Xuất chuẩn: ' + cap.label + ' → MP4. Dựng từng khung hình nên không rơi khung, không nháy; máy chậm chỉ xuất lâu hơn. Có thể tắt màn hình tạm — quay lại app sẽ tiếp tục.';
      else if (cap.videoOnly) msg = eng === 'webcodecs' ? '⚠ Máy chỉ mã hoá được hình (' + cap.reason + '). Video sẽ không có tiếng — bấm Lưu âm thanh WAV rồi ghép trong CapCut.' : 'Máy chưa mã hoá được âm thanh (' + cap.reason + ') → Tự động sẽ ghi thời gian thực. Chọn Xuất chuẩn nếu muốn video nét không tiếng + file WAV riêng.';
      else msg = eng === 'webcodecs' ? '✗ Máy chưa hỗ trợ Xuất chuẩn: ' + cap.reason + '. Hãy chọn Tự động.' : 'Máy chưa hỗ trợ Xuất chuẩn (' + cap.reason + ') → dùng ghi thời gian thực' + (mime ? ' (' + mime.split(';')[0] + ')' : '') + '.';
      var el = $('#exProbe'); if (el) el.textContent = msg + ' · Thời lượng ' + fmt(S.TL.total);
    });
    if (S.exporting) {
      pane.appendChild(h('div', { class: 'card' }, h('b', { id: 'exText' }, 'Đang chuẩn bị…'), h('div', { class: 'progress' }, h('i', { id: 'exBar' })),
        h('div', null, h('button', { type: 'button', class: 'btn danger', onclick: function () { S.cancelExport = true; S.cancelReason = 'Đã huỷ xuất video'; } }, 'Huỷ'))));
      updExProgress();
    } else {
      pane.appendChild(h('div', null, h('button', { type: 'button', class: 'btn marker', id: 'startExport', onclick: function () { exportVideo(); } }, 'Bắt đầu xuất video')));
    }
    pane.appendChild(h('ul', { class: 'hint', style: 'margin:0;padding-left:18px' },
      h('li', null, 'Xuất chuẩn: không phát tiếng trong lúc xuất; 1 phút video thường mất 1–4 phút trên điện thoại tầm trung.'),
      h('li', null, 'Ghi thời gian thực: giữ màn hình sáng, không chuyển app; bạn sẽ nghe âm thanh trong lúc ghi.'),
      h('li', null, 'MP4 (H.264 + AAC) đăng thẳng lên TikTok, YouTube Shorts, Reels và mở được trong CapCut.')));
    if (S.lastExport && !S.exporting) {
      var L = S.lastExport, name = baseName() + '-' + (L.format || '9:16').replace(':', 'x') + '-' + (Math.min(L.W, L.H) >= 1080 ? '1080p' : '720p') + '.' + L.ext;
      var share = null;
      try {
        var file = new File([L.blob], name, { type: L.blob.type });
        if (navigator.canShare && navigator.canShare({ files: [file] })) share = h('button', { type: 'button', class: 'btn', onclick: function () { navigator.share({ files: [file], title: N.plainText(S.P.title) || 'Video' }).catch(function () { }); } }, 'Chia sẻ');
      } catch (e) { }
      pane.appendChild(h('div', { class: 'card', id: 'exResult' },
        h('b', null, 'Video của bạn · ' + (L.blob.size / 1048576).toFixed(1) + ' MB · ' + L.ext.toUpperCase() + ' · ' + L.W + '×' + L.H),
        h('p', { class: 'hint' }, L.info + (L.silent ? ' — nhớ Lưu âm thanh WAV để ghép tiếng.' : '')),
        h('video', { class: 'result', src: L.url, controls: true, playsinline: true, style: 'aspect-ratio:' + L.W + '/' + L.H + (L.W > L.H ? ';max-width:100%' : '') }),
        h('div', { class: 'row' }, h('button', { type: 'button', class: 'btn primary', onclick: function () { saveBlob(L.blob, name); } }, 'Lưu video'), share)));
    }
    pane.appendChild(h('div', { class: 'card' }, h('b', null, 'Xuất thêm'),
      h('p', { class: 'hint' }, 'Âm thanh WAV (trộn sẵn giọng, nhạc, hiệu ứng) và phụ đề SRT để chỉnh tiếp trong CapCut/YouTube. Ảnh bìa: tua tới khoảnh khắc biểu cảm mạnh nhất rồi lưu PNG.' + (hasClaude ? ' Trong Claude, WAV và SRT được nén trong file .zip.' : '')),
      h('div', { class: 'row' },
        h('button', { type: 'button', class: 'btn', onclick: saveAudio, disabled: S.exporting || null }, 'Lưu âm thanh WAV'),
        h('button', { type: 'button', class: 'btn', onclick: saveSrt }, 'Lưu phụ đề SRT'),
        h('button', { type: 'button', class: 'btn', disabled: S.exporting || null, onclick: function () {
          N.renderFrame(ctx, env(), S.t);
          cv.toBlob(function (b) { if (b) saveBlob(b, baseName() + '-thumbnail.png'); draw(); }, 'image/png');
        } }, 'Lưu ảnh bìa PNG'))));
    var tech = h('details', { class: 'more' }, h('summary', null, 'Thông tin kỹ thuật (gửi kèm khi báo lỗi)'));
    var pre = h('pre', { class: 'tech' });
    tech.addEventListener('toggle', function () { if (tech.open) pre.textContent = techInfo(); });
    tech.appendChild(h('div', { class: 'more-body' }, pre, h('div', null, h('button', { type: 'button', class: 'btn small', html: ICON.copy + ' Sao chép', onclick: function () { copyText(techInfo()); } }))));
    pane.appendChild(tech);
  }

  /* ---------- sự kiện chung ---------- */
  $('#playBtn').addEventListener('click', function () { S.playing ? stop() : play(); });
  $('#bigPlay').addEventListener('click', function () { play(); });
  $('#prevBeat').addEventListener('click', function () { var i = curBeat(), b = S.TL.beats[i]; if (!b) return; var j = (S.t - b.start > 0.4) ? i : Math.max(0, i - 1); seek(S.TL.beats[j].start + 0.05); });
  $('#nextBeat').addEventListener('click', function () { var i = curBeat(); var b = S.TL.beats[Math.min(S.TL.beats.length - 1, i + 1)]; if (b) seek(b.start + 0.05); });
  $('#scrub').addEventListener('input', function (e) { seek(S.TL.total * (+e.target.value) / 1000); });
  $('#topExport').addEventListener('click', function () { openTab('export'); });
  $('#undoBtn').addEventListener('click', function () { if (undo()) toast('Đã hoàn tác (' + HIST.i + ' bước còn lại)'); });
  $('#redoBtn').addEventListener('click', function () { if (redo()) toast('Đã làm lại'); });
  document.addEventListener('keydown', function (e) {
    var inField = e.target.closest && e.target.closest('input,textarea,select');
    var mod = e.ctrlKey || e.metaKey;
    if (mod && !inField && (e.key === 'z' || e.key === 'Z')) { e.preventDefault(); if (e.shiftKey) redo(); else undo(); return; }
    if (mod && !inField && (e.key === 'y' || e.key === 'Y')) { e.preventDefault(); redo(); return; }
    if (inField) return;
    if (e.code === 'Space') { e.preventDefault(); S.playing ? stop() : play(); }
  });
  var mini = $('#mini');
  mini.addEventListener('click', function () { $('#stage').scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (en) {
      miniOn = !en[0].isIntersecting; mini.hidden = !miniOn; if (miniOn) miniCtx.drawImage(cv, 0, 0, miniCv.width, miniCv.height);
    }, { threshold: 0.15 }).observe($('#stage'));
  }

  /* ---------- khởi động ---------- */
  $('#foot').textContent = 'Người Que Studio ' + N.VERSION + ' · chạy hoàn toàn trên thiết bị của bạn, không tải video lên máy chủ.';
  S.exportRes = store.get('nqs.res') || 720;
  S.exportEngine = store.get('nqs.engine') || 'auto';
  S.pickDest = !!store.get('nqs.pickDest');
  N.cleanExportTemp(null);
  var saved = store.get('nqs.project');
  var r0 = N.normalize(saved && saved.beats ? saved : N.TEMPLATES[0].project);
  S.P = r0.project; S.warnings = r0.warnings;
  S.TL = N.buildTimeline(S.P, {});
  S.t = Math.min(1.2, S.TL.total);
  var tab0 = store.get('nqs.tab'); if (tab0 && $('.tab[data-tab="' + tab0 + '"]')) S.tab = tab0;
  $$('.tab').forEach(function (x) { x.setAttribute('aria-selected', String(x.dataset.tab === S.tab)); });
  $$('.pane').forEach(function (p) { p.hidden = p.id !== 'pane-' + S.tab; });
  rebuild();
  histReset();
  fontsReady().then(function () { N.clearBgCache(); draw(); });
  idb.all().then(function (list) {
    return Promise.all((list || []).map(function (a) { return hydrate(a).then(function () { S.A[a.id] = a; }).catch(function () { }); }));
  }).then(function () { if (Object.keys(S.A).length) { N.clearBgCache(); rebuild(); } });

  // móc kiểm thử (tests/e2e.py)
  window.__nqs = {
    S: S, N: N, seek: seek, play: play, stop: stop, draw: draw, exportVideo: exportVideo, setProject: setProject, openTab: openTab, pickMime: pickMime, mutate: mutate,
    undo: undo, redo: redo, hist: function () { return { i: HIST.i, n: HIST.list.length }; },
    lib: { all: libAll, user: libUser, save: saveToLib, add: addFromLib, remove: removeLib, pack: function () { return packAssets(usedAssets([], libUser())); } },
    tpl: { all: allTpls, mine: myTpls, save: saveTpl, remove: removeTpl },
    importData: importData, importFaceSheet: importFaceSheet, saveAudio: saveAudio, saveSrt: saveSrt, probe: probeFor, techInfo: techInfo,
    selectChar: selectChar, posePreset: posePreset, rotateBy: rotateBy, scenes: { add: addScene, setBg: setSceneBg, move: moveScene, remove: removeScene },
    timeline: TLV, renderTimeline: renderTimeline,
    rotHandle: function (id) { var sh = N.lastHits.filter(function (x) { return x.id === id; })[0]; return sh && N.lastCam ? rotHandle(sh, N.lastCam) : null; }
  };
})(NQS);

</script>
